name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Chạy tay (tab Actions → Build → Run workflow): build đủ cả iOS, và nếu
  # đã khai báo secret App Store Connect thì upload luôn lên TestFlight.
  workflow_dispatch:
    inputs:
      android_release:
        description: 'Build APK/AAB release đã ký (để tải lên Play Console), không cần gắn tag'
        type: boolean
        default: false
      ios:
        description: 'Build iOS (có secret thì ký và đẩy lên TestFlight)'
        type: boolean
        default: true
      ios_screenshots:
        description: 'Chụp ảnh màn hình App Store trên iOS Simulator (chế độ demo)'
        type: boolean
        default: false

env:
  # pubspec.lock yêu cầu Flutter >= 3.44 (Dart >= 3.12).
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  # URL công khai của Cloudflare Worker (không phải secret) — cần truyền vào
  # lúc build release để app đăng ký FCM token, nếu không push notification
  # sẽ báo "Đã bật, chưa kết nối server gửi thông báo" dù có quyền OS.
  LO_WORKER_URL: 'https://lo-gold-proxy.webjscloud.workers.dev'
  # Flutter 3.47 yêu cầu AGP >= 8.11.1, project đang dùng 8.9.1.
  ANDROID_BUILD_FLAGS: '--android-skip-build-dependency-validation'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Diagnostic — flutter doctor
        run: flutter doctor -v

      - run: flutter pub get

      # Không chặn build vì 9 warning cũ chưa dọn; bỏ 2 cờ này khi đã clean.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Diagnostic — flutter doctor
        run: flutter doctor -v

      - run: flutter pub get
      - run: flutter test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Diagnostic — flutter doctor
        run: flutter doctor -v

      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run --dart-define=LO_WORKER_URL=${{ env.LO_WORKER_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: build/web/
          retention-days: 14

      - name: Zip web build for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/web
          zip -r ../../lo-web-${{ github.ref_name }}.zip .

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: web-release-zip
          path: lo-web-${{ github.ref_name }}.zip
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze]
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Diagnostic — flutter doctor
        run: flutter doctor -v

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug $ANDROID_BUILD_FLAGS

      # Setup release signing khi tag v* + có secret ANDROID_KEYSTORE_B64.
      # Nếu secret rỗng → key.properties không tồn tại → build.gradle.kts
      # fallback debug key → APK release vẫn có nhưng unsigned.
      - name: Decode release keystore
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.android_release) && env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/lo-release.jks
          cat > android/key.properties <<EOF
          storeFile=lo-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK (tag hoặc android_release)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.android_release)
        run: flutter build apk --release $ANDROID_BUILD_FLAGS --dart-define=LO_WORKER_URL=${{ env.LO_WORKER_URL }}

      # Google Play Console bắt buộc .aab (Android App Bundle) để nộp app
      # mới — .apk ở trên chỉ dùng để cài thử/phân phối ngoài Play Store.
      - name: Build release AAB cho Play Store (tag hoặc android_release)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.android_release)
        run: flutter build appbundle --release $ANDROID_BUILD_FLAGS --dart-define=LO_WORKER_URL=${{ env.LO_WORKER_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.android_release)
        with:
          name: apk-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.android_release)
        with:
          name: aab-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # iOS — chạy khi push tag v* hoặc chạy tay (workflow_dispatch).
  #
  # Có đủ 4 secret dưới đây → ký app bằng chứng chỉ Apple Distribution, build
  # IPA và upload lên App Store Connect (TestFlight). Thiếu → chỉ build IPA
  # chưa ký để kiểm tra. Cách tạo secret: docs/BUILD.md mục 7.
  #   APP_STORE_CONNECT_ISSUER_ID       Issuer ID của API key
  #   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID
  #   APP_STORE_CONNECT_PRIVATE_KEY     Nội dung file AuthKey_XXXX.p8
  #   CERTIFICATE_PRIVATE_KEY           RSA private key (PEM) của chứng chỉ
  build-ios:
    name: Build iOS IPA
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    needs: [analyze]
    env:
      BUNDLE_ID: 'vn.lo.app'
      # codemagic-cli-tools đọc trực tiếp các biến môi trường này.
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect chỉ nhận build từ Xcode/iOS SDK đủ mới.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Diagnostic — flutter doctor
        run: flutter doctor -v

      - run: flutter pub get

      - name: Kiểm tra secret ký app
        id: signing
        run: |
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && [ -n "$CERTIFICATE_PRIVATE_KEY" ] \
             && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Thiếu secret App Store Connect — chỉ build IPA chưa ký."
          fi

      # ── Không ký ──────────────────────────────────────────────────
      - name: Build iOS (no codesign)
        if: steps.signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign --dart-define=LO_WORKER_URL=${{ env.LO_WORKER_URL }}

      - name: Package unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr ../../../lo-ios-${{ github.run_number }}-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled != 'true'
        with:
          name: ipa-unsigned-${{ github.run_number }}
          path: lo-ios-${{ github.run_number }}-unsigned.ipa
          retention-days: 30

      # ── Ký app + TestFlight ───────────────────────────────────────
      - uses: actions/setup-python@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          python-version: '3.12'

      - name: Cài codemagic-cli-tools
        if: steps.signing.outputs.enabled == 'true'
        run: pip install codemagic-cli-tools

      # Tạo keychain tạm, lấy (hoặc tạo mới nếu chưa có) chứng chỉ Apple
      # Distribution + provisioning profile App Store cho BUNDLE_ID qua App
      # Store Connect API, rồi gắn profile vào project Xcode. Bước cuối ghi
      # ~/export_options.plist cho `flutter build ipa`.
      - name: Setup iOS signing
        if: steps.signing.outputs.enabled == 'true'
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      # Build number = số lần chạy workflow, luôn tăng nên App Store Connect
      # không từ chối. Version name lấy từ pubspec.yaml.
      - name: Build signed IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=LO_WORKER_URL=${{ env.LO_WORKER_URL }}

      - name: Upload lên App Store Connect (TestFlight)
        if: steps.signing.outputs.enabled == 'true'
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"

      - name: Đổi tên IPA đã ký
        if: steps.signing.outputs.enabled == 'true'
        run: cp build/ios/ipa/*.ipa "lo-ios-${{ github.run_number }}.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ipa-signed-${{ github.run_number }}
          path: lo-ios-${{ github.run_number }}.ipa
          retention-days: 30

      - name: Dọn keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: keychain use-login || true

  # Ảnh chụp màn hình cho App Store: build bản demo (LO_DEMO) cho Simulator
  # iPhone Pro (6.3", 1206x2622 — cỡ App Store Connect yêu cầu), app tự nạp dữ liệu mẫu và tự chuyển tab 10 giây một
  # lần; cứ 2 giây chụp 1 ảnh rồi chọn ảnh đẹp từ artifact.
  ios-screenshots:
    name: iOS screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.ios_screenshots
    runs-on: macos-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Build demo app cho Simulator
        run: flutter build ios --simulator --dart-define=LO_DEMO=true

      - name: Chụp ảnh trên Simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          found = [d for runtime in sorted(devices) if 'iOS' in runtime
                   for d in devices[runtime]
                   if d['name'].startswith('iPhone') and d['name'].endswith(' Pro')]
          print(found[-1]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" vn.lo.app
          mkdir -p shots
          sleep 15
          for i in $(seq -w 1 50); do
            xcrun simctl io "$UDID" screenshot "shots/$i.png" >/dev/null 2>&1 || true
            sleep 2
          done
          ls -la shots | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: shots/*.png
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.zip" \) \
            -exec cp {} release/ \;
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
